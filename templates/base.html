<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('app_title') }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0b0f;
    --bg-grad: radial-gradient(1200px 520px at 8% -10%, #171933 0%, transparent 60%),
               radial-gradient(900px 480px at 100% 0%, #112022 0%, transparent 55%);
    --surface: #131420;
    --surface-2: #181a28;
    --surface-3: #1e2032;
    --text: #eef0f8;
    --muted: #949aad;
    --border: #262838;
    --accent: #7c7bff;
    --accent-2: #4fd1a5;
    --accent-ink: #0b0c10;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
    --shadow-hover: 0 4px 10px rgba(0,0,0,0.35), 0 16px 32px -12px rgba(0,0,0,0.6);
    --radius: 14px;
    --radius-sm: 9px;
    --ok: #35c17e;
    --warn: #e8a33d;
    --bad: #ff6b6b;
    --input-bg: #0e0f18;
    --grid-header: #171a28;
    --grid-line: #22243500;
    --row-alt: rgba(255,255,255,0.015);
    --row-hover: rgba(124,123,255,0.07);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f4f9;
    --bg-grad: radial-gradient(1200px 500px at 8% -10%, #eef0ff 0%, transparent 60%),
               radial-gradient(900px 480px at 100% 0%, #eafff3 0%, transparent 55%);
    --surface: #ffffff;
    --surface-2: #f8f8fc;
    --surface-3: #f1f2f8;
    --text: #15161d;
    --muted: #6b6f80;
    --border: #e6e7f0;
    --accent: #5b5bf5;
    --accent-2: #0f9d66;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 8px 24px -8px rgba(20, 20, 40, 0.10);
    --shadow-hover: 0 4px 10px rgba(20, 20, 40, 0.06), 0 16px 32px -12px rgba(20, 20, 40, 0.16);
    --ok: #0f9d58;
    --warn: #d97706;
    --bad: #dc2626;
    --input-bg: #ffffff;
    --grid-header: #f6f7fb;
    --row-alt: rgba(20,20,60,0.015);
    --row-hover: rgba(91,91,245,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    background-image: var(--bg-grad);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.1rem 4rem; }
  .wrap.narrow { max-width: 420px; padding-top: 4rem; }

  header.top {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-bottom: 1.6rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem; flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  header.top h1 { font-size: 1.32rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  header.top p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.86rem; }
  header.top .spacer { flex: 1; }

  .toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .toolbar form { display: inline; }
  .pill-btn, .lang-switch a, .theme-btn {
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 0.4rem 0.8rem;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .pill-btn:hover, .lang-switch a:hover, .theme-btn:hover { border-color: var(--accent); }
  .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .lang-switch a { border: none; border-radius: 0; padding: 0.4rem 0.65rem; }
  .lang-switch a.active { background: var(--accent); color: var(--accent-ink); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin-bottom: 2rem; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    box-shadow: var(--shadow);
  }
  .stat .num { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .stat .label { font-size: 0.74rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.1rem; }
  .stat.accent-ok .num { color: var(--ok); }
  .stat.accent-warn .num { color: var(--warn); }

  section { margin-bottom: 2.2rem; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.9rem; }
  .section-head h2 { font-size: 1.05rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .section-head .count { color: var(--muted); font-size: 0.82rem; font-weight: 600; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel.form-panel { padding: 1.1rem 1.2rem; overflow: visible; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td {
    text-align: left;
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.86rem;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: var(--surface-2); }
  th { color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-2); }
  td.company { font-weight: 600; }
  td.note { white-space: normal; color: var(--muted); font-size: 0.82rem; max-width: 220px; }

  /* --- Excel-style grid component (sort + filter + inline edit) --- */
  .grid-toolbar { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  .grid-toolbar .grid-search {
    flex: 1; min-width: 180px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.5rem 0.75rem;
    color: var(--text);
    font-size: 0.84rem;
  }
  .grid-toolbar .grid-search:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .grid-count { color: var(--muted); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }

  table.grid { width: 100%; border-collapse: collapse; min-width: 760px; }
  table.grid thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--grid-header);
    border-bottom: 2px solid var(--accent-2);
    border-right: 1px solid var(--border);
    padding: 0.55rem 0.8rem;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  table.grid thead th:last-child { border-right: none; cursor: default; }
  table.grid thead th .sort-arrow { opacity: 0.35; margin-left: 0.3rem; font-size: 0.7em; }
  table.grid thead th.sorted .sort-arrow { opacity: 1; color: var(--accent-2); }
  table.grid thead th:hover:not(.no-sort) { color: var(--text); }

  table.grid .filter-row th {
    position: sticky; top: 33px; z-index: 1;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 0.35rem 0.5rem;
    cursor: default;
  }
  table.grid .filter-row th:last-child { border-right: none; }
  table.grid .filter-row input, table.grid .filter-row select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.45rem;
    font-size: 0.76rem;
    color: var(--text);
  }

  table.grid tbody td {
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid transparent;
    font-size: 0.85rem;
  }
  table.grid tbody tr:nth-child(even) { background: var(--row-alt); }
  table.grid tbody tr:hover { background: var(--row-hover); }
  table.grid tbody tr.new-row { background: transparent; }
  table.grid tbody tr.new-row:hover { background: var(--row-hover); }
  table.grid tbody tr.new-row td { border-bottom: 2px dashed var(--border); }
  table.grid tbody tr.row-hidden { display: none; }

  td.cell-editable { position: relative; cursor: text; }
  td.cell-editable:hover { outline: 1px dashed var(--accent-2); outline-offset: -2px; }
  td.cell-editable .cell-input, td.cell-editable .cell-select {
    width: 100%;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--accent-2);
    border-radius: 6px;
    padding: 0.25rem 0.4rem;
    font-size: 0.85rem;
    font-family: inherit;
  }
  td.cell-editable .cell-value.placeholder { color: var(--muted); font-style: italic; }
  td.cell-saved { animation: cell-flash 0.9s ease; }
  @keyframes cell-flash {
    0% { background: rgba(79, 209, 165, 0.35); }
    100% { background: transparent; }
  }
  td.cell-error { outline: 2px solid var(--bad); outline-offset: -2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  :root[data-theme="dark"] .pill-sent { background: #23244a; color: #b3b2ff; }
  :root[data-theme="dark"] .pill-followed-up { background: #3a2a14; color: #ffbd7a; }
  :root[data-theme="dark"] .pill-interview { background: #33223f; color: #dcb4ff; }
  :root[data-theme="dark"] .pill-offer { background: #113626; color: #7cf0ae; }
  :root[data-theme="dark"] .pill-rejected { background: #3a1818; color: #ff9b9b; }
  :root[data-theme="light"] .pill-sent { background: #eef0ff; color: #4338ca; }
  :root[data-theme="light"] .pill-followed-up { background: #fff7ed; color: #c2410c; }
  :root[data-theme="light"] .pill-interview { background: #f3e8ff; color: #7e22ce; }
  :root[data-theme="light"] .pill-offer { background: #ecfdf3; color: #0f7d44; }
  :root[data-theme="light"] .pill-rejected { background: #fef2f2; color: #b91c1c; }

  .job-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
  @media (max-width: 680px) { .job-grid { grid-template-columns: 1fr; } }
  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem;
    box-shadow: var(--shadow);
    transition: box-shadow 0.18s, transform 0.18s;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .job-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .job-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
  .job-card h3 { margin: 0; font-size: 0.98rem; font-weight: 700; line-height: 1.3; }
  .job-card h3 .pos { display: block; color: var(--muted); font-weight: 500; font-size: 0.82rem; margin-top: 0.15rem; }
  .job-meta { color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .job-meta .dot { opacity: 0.5; }
  .job-reason { font-size: 0.85rem; line-height: 1.45; color: var(--text); opacity: 0.85; flex-grow: 1; }
  .job-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.2rem; }

  .tag {
    display: inline-flex; align-items: center;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .tag-great { background: linear-gradient(135deg, #0f9d58, #35c17e); color: #fff; }
  :root[data-theme="dark"] .tag-good { background: #3a2c10; color: #ffcf7a; }
  :root[data-theme="dark"] .tag-stretch { background: #3a1a1a; color: #ff9b9b; }
  :root[data-theme="light"] .tag-good { background: #fff3da; color: #92600a; }
  :root[data-theme="light"] .tag-stretch { background: #fde8e8; color: #a32424; }

  a.link-btn {
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.82rem;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  a.link-btn:hover { text-decoration: underline; }

  button, select, input {
    font-family: inherit;
  }
  button.primary-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.5rem 1rem;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px -4px rgba(91, 91, 245, 0.5);
    transition: filter 0.15s, transform 0.1s;
  }
  button.primary-btn:hover { filter: brightness(1.08); }
  button.primary-btn:active { transform: scale(0.97); }
  button.danger-btn {
    background: transparent;
    color: var(--bad);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.35rem 0.6rem;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.danger-btn:hover { border-color: var(--bad); }

  .row-actions { display: flex; align-items: center; gap: 0.4rem; }
  select.status-select {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.3rem 0.5rem;
    font-size: 0.78rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.7rem;
    align-items: end;
  }
  @media (max-width: 820px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .field input, .field select {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.55rem 0.65rem;
    font-size: 0.86rem;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .auth-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.8rem;
  }
  .auth-panel h1 { margin: 0 0 0.3rem; font-size: 1.3rem; }
  .auth-panel .sub { color: var(--muted); font-size: 0.86rem; margin-bottom: 1.3rem; }
  .auth-field { margin-bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .auth-field label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .auth-field input {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.65rem 0.75rem;
    font-size: 0.92rem;
  }
  .auth-field .hint { color: var(--muted); font-size: 0.74rem; }
  .auth-error {
    background: rgba(255, 107, 107, 0.12);
    color: var(--bad);
    border: 1px solid rgba(255, 107, 107, 0.3);
    border-radius: 9px;
    padding: 0.6rem 0.8rem;
    font-size: 0.82rem;
    margin-bottom: 1rem;
  }
  .auth-success {
    background: rgba(53, 193, 126, 0.12);
    color: var(--ok);
    border: 1px solid rgba(53, 193, 126, 0.3);
    border-radius: 9px;
    padding: 0.6rem 0.8rem;
    font-size: 0.82rem;
    margin-bottom: 1rem;
  }
  .auth-switch { margin-top: 1.1rem; font-size: 0.84rem; color: var(--muted); text-align: center; }
  .auth-switch a { color: var(--accent); font-weight: 600; text-decoration: none; }
  button.full-btn { width: 100%; }

  .empty {
    color: var(--muted);
    font-size: 0.88rem;
    padding: 2rem 1rem;
    text-align: center;
  }
  footer.foot { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 2.5rem; }
</style>
</head>
<body>
<div class="wrap{% block wrapclass %}{% endblock %}">
  {% block body %}{% endblock %}
</div>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();

  function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  }
</script>
</body>
</html>
