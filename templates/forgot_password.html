{% extends "base.html" %}
{% block wrapclass %} narrow{% endblock %}
{% block body %}
<header class="top">
  <div class="spacer"></div>
  <div class="toolbar">
    <span class="lang-switch">
      <a href="{{ url_for('main.set_lang', lang_code='tr') }}" class="{{ 'active' if lang == 'tr' else '' }}">TR</a>
      <a href="{{ url_for('main.set_lang', lang_code='en') }}" class="{{ 'active' if lang == 'en' else '' }}">EN</a>
    </span>
  </div>
</header>

<div class="auth-panel">
  <h1>{{ t('forgot_heading') }}</h1>

  {% if not mail_configured %}
    <div class="auth-error">{{ t('forgot_disabled') }}</div>
  {% elif sent %}
    <div class="auth-success">{{ t('forgot_sent') }}</div>
  {% else %}
    <form method="post" action="{{ url_for('main.forgot_password') }}">
      <div class="auth-field">
        <label for="email">{{ t('forgot_email') }}</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="primary-btn full-btn">{{ t('forgot_submit') }}</button>
    </form>
  {% endif %}

  <div class="auth-switch">
    <a href="{{ url_for('main.login') }}">{{ t('forgot_back_to_login') }}</a>
  </div>
</div>
{% endblock %}
